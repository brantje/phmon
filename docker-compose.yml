name: phmon
services:
  postgres:
    image: postgres:18.6-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-phmon}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Copy .env.example to .env first}
      POSTGRES_DB: ${POSTGRES_DB:-phmon}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5435}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 3s
      retries: 10
  server:
    build: ./server
    environment:
      HTTP_ADDR: 0.0.0.0:8081
      DATABASE_URL: postgres://${POSTGRES_USER:-phmon}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-phmon}?sslmode=disable
      OPERATOR_ACCESS_SECRET: ${OPERATOR_ACCESS_SECRET:?Set OPERATOR_ACCESS_SECRET}
      OPERATOR_SESSION_COOKIE: ${OPERATOR_SESSION_COOKIE:-phmon_operator}
      OPERATOR_ALLOWED_ORIGINS: ${OPERATOR_ALLOWED_ORIGINS:?Set OPERATOR_ALLOWED_ORIGINS}
      OPERATOR_ALLOW_INSECURE_LOOPBACK: ${OPERATOR_ALLOW_INSECURE_LOOPBACK:-false}
    ports:
      - "${SERVER_BIND_ADDR:-127.0.0.1}:${SERVER_PORT:-8081}:8081"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:8081/readyz"]
      interval: 5s
      timeout: 4s
      retries: 10
  web:
    build: ./web
    environment:
      NUXT_BACKEND_URL: http://server:8081
      NUXT_PUBLIC_INSTANCE_URL: ${NUXT_PUBLIC_INSTANCE_URL:-}
      NUXT_OPERATOR_COOKIE_NAME: ${NUXT_OPERATOR_COOKIE_NAME:-phmon_operator}
    ports:
      - "${WEB_BIND_ADDR:-0.0.0.0}:${WEB_PORT:-3005}:3000"
    depends_on:
      server:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 4s
      retries: 10
volumes:
  postgres_data:
