name: Temporary drop reference previews
on:
  push:
    branches: [feat/90-economy-item-analytics]
    paths:
      - .github/workflows/drop-reference-preview.yml
jobs:
  previews:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Print resized reference screenshots
        shell: bash
        run: |
          python3 -m venv /tmp/phmon-preview-env
          /tmp/phmon-preview-env/bin/pip install -q Pillow
          /tmp/phmon-preview-env/bin/python - <<'PY'
          from PIL import Image
          import io, base64
          for name in ["normal", "rare"]:
              path = f"phmonitor_screenshots/05-{name}-drops.png"
              image = Image.open(path).convert("RGB")
              image.thumbnail((1400, 1050))
              buffer = io.BytesIO()
              image.save(buffer, "JPEG", quality=72, optimize=True)
              print(f"PHMON_IMAGE_BEGIN_{name.upper()}")
              print(base64.b64encode(buffer.getvalue()).decode("ascii"))
              print(f"PHMON_IMAGE_END_{name.upper()}")
          PY
