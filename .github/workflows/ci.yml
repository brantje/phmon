name: Validation
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18.6-alpine
        env:
          POSTGRES_USER: phmon
          POSTGRES_PASSWORD: ci_only
          POSTGRES_DB: phmon
        ports:
          - 5435:5432
        options: >-
          --health-cmd "pg_isready -U phmon -d phmon"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://phmon:ci_only@127.0.0.1:5435/phmon?sslmode=disable
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.sum
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm --prefix web ci
      - run: bash scripts/check.sh
  stack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: cp .env.example .env
      - run: docker compose up --build -d --wait --wait-timeout 180
      - run: python3 scripts/smoke.py
      - name: Verify database outage
        run: |
          docker compose stop postgres
          EXPECT_UNAVAILABLE=1 python3 scripts/smoke.py
      - name: Verify database recovery
        run: |
          docker compose up -d --wait --wait-timeout 120
          python3 scripts/smoke.py
      - if: failure()
        run: docker compose logs --no-color
      - if: always()
        run: docker compose down -v
