name: Validation
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18.6-alpine
        env:
          POSTGRES_USER: phmon
          POSTGRES_PASSWORD: ci_only
          POSTGRES_DB: phmon
        ports:
          - 5435:5432
        options: >-
          --health-cmd "pg_isready -U phmon -d phmon"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://phmon:ci_only@127.0.0.1:5435/phmon?sslmode=disable
      OPERATOR_ACCESS_SECRET: phmon-ci-only-not-for-deployment
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.sum
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm --prefix web ci
      - run: bash scripts/check.sh
  stack:
    runs-on: ubuntu-latest
    env:
      OPERATOR_ACCESS_SECRET: phmon-local-development-operator-secret-change-me-2026
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm --prefix web ci
      - run: cp .env.example .env
      - name: Permit plain HTTP only for loopback Compose smoke tests
        run: sed -i 's/^OPERATOR_ALLOW_INSECURE_HTTP=false$/OPERATOR_ALLOW_INSECURE_HTTP=true/' .env
      - run: docker compose up --build -d --wait --wait-timeout 180
      - run: python3 scripts/smoke.py
      - name: Verify production browser live WebSocket path
        run: python3 scripts/live_smoke.py
      - name: Verify authenticated remote command through production plugin worker
        id: command_smoke
        env:
          OPERATOR_ACCESS_SECRET: phmon-local-development-operator-secret-change-me-2026
          PHMON_AGENT_URL: ws://127.0.0.1:8081/agent
        run: python3 scripts/command_smoke.py
      - name: Verify transient navigation and observed arrival through production plugin worker
        env:
          OPERATOR_ACCESS_SECRET: phmon-local-development-operator-secret-change-me-2026
          PHMON_AGENT_URL: ws://127.0.0.1:8081/agent
          PHMON_SMOKE_COMPOSE_PROJECT: phmon
          SMOKE_WEB_URL: http://127.0.0.1:3005
        run: |
          python3 scripts/navigation_smoke.py
          PHMON_NAVIGATION_SMOKE_OUTDOOR_SEAM=1 python3 scripts/navigation_smoke.py
      - name: Verify authenticated agent connect, reconnect and disconnect
        shell: bash
        run: |
          set -euo pipefail
          agent_json=$(python3 - <<'PY'
          import json
          import os
          import sys
          from urllib.request import Request, urlopen

          sys.path.insert(0, "scripts")
          from smoke_auth import login_cookie

          origin = "http://127.0.0.1:3005"
          cookie = login_cookie(origin, origin, os.getcwd())
          request = Request(
              origin + "/api/agents/credentials",
              data=b"{}",
              headers={
                  "Content-Type": "application/json",
                  "Origin": origin,
                  "Sec-Fetch-Site": "same-origin",
                  "Cookie": cookie,
              },
              method="POST",
          )
          with urlopen(request, timeout=10) as response:
              print(response.read().decode())
          PY
          )
          export EXPECT_AGENT_ID
          export PHMON_AGENT_ID
          export PHMON_AGENT_TOKEN
          EXPECT_AGENT_ID=$(python3 -c 'import json,sys; print(json.load(sys.stdin)["agent_id"])' <<<"$agent_json")
          PHMON_AGENT_ID="$EXPECT_AGENT_ID"
          PHMON_AGENT_TOKEN=$(python3 -c 'import json,sys; print(json.load(sys.stdin)["agent_token"])' <<<"$agent_json")
          export PHMON_AGENT_URL=ws://127.0.0.1:8081/agent
          export PHMON_SIMULATOR_SCENARIO=character-lifecycle

          python3 scripts/agent_simulator.py >/tmp/phmon-agent.log 2>&1 &
          simulator_pid=$!
          cleanup() {
            if [[ -n "${simulator_pid:-}" ]]; then
              kill -TERM "$simulator_pid" 2>/dev/null || true
              wait "$simulator_pid" 2>/dev/null || true
            fi
            cat /tmp/phmon-agent.log || true
          }
          trap cleanup EXIT

          python3 scripts/agent_smoke.py
          python3 scripts/character_smoke.py
          python3 scripts/live_smoke.py

          rm -f /tmp/phmon-browser-ready /tmp/phmon-browser-restart-ready /tmp/phmon-browser-audit.log
          BROWSER_AUDIT_REQUIRE_RECONNECT=1 \
            BROWSER_AUDIT_READY_FILE=/tmp/phmon-browser-ready \
            BROWSER_AUDIT_RESTART_READY_FILE=/tmp/phmon-browser-restart-ready \
            node scripts/browser_live_audit.mjs >/tmp/phmon-browser-audit.log 2>&1 &
          browser_pid=$!
          cleanup() {
            if [[ -n "${browser_pid:-}" ]]; then
              kill -TERM "$browser_pid" 2>/dev/null || true
              wait "$browser_pid" 2>/dev/null || true
            fi
            if [[ -n "${simulator_pid:-}" ]]; then
              kill -TERM "$simulator_pid" 2>/dev/null || true
              wait "$simulator_pid" 2>/dev/null || true
            fi
            cat /tmp/phmon-browser-audit.log 2>/dev/null || true
            cat /tmp/phmon-agent.log || true
          }
          for _ in $(seq 1 1400); do
            [[ -f /tmp/phmon-browser-ready ]] && break
            kill -0 "$browser_pid" 2>/dev/null || {
              cat /tmp/phmon-browser-audit.log
              exit 1
            }
            sleep 0.1
          done
          test -f /tmp/phmon-browser-ready

          docker compose stop server
          docker compose up -d --wait --wait-timeout 120 server
          touch /tmp/phmon-browser-restart-ready
          python3 scripts/agent_smoke.py
          python3 scripts/character_smoke.py
          wait "$browser_pid"
          browser_pid=
          cat /tmp/phmon-browser-audit.log

          kill -TERM "$simulator_pid" 2>/dev/null || true
          wait "$simulator_pid" || true
          simulator_pid=
          EXPECT_AGENT_CONNECTED=0 python3 scripts/agent_smoke.py
          trap - EXIT
          cat /tmp/phmon-agent.log
      - name: Verify database outage and live recovery synchronization
        id: outage
        continue-on-error: true
        env:
          PHMON_COMPOSE_PROJECT: phmon
        run: |
          set -euo pipefail
          rm -f /tmp/phmon-live-recovery-ready /tmp/phmon-live-recovery-stale /tmp/phmon-live-recovery.log
          LIVE_RECOVERY_READY_FILE=/tmp/phmon-live-recovery-ready \
            LIVE_RECOVERY_STALE_FILE=/tmp/phmon-live-recovery-stale \
            python3 scripts/live_recovery_smoke.py >/tmp/phmon-live-recovery.log 2>&1 &
          live_recovery_pid=$!
          cleanup_live_recovery() {
            kill -TERM "$live_recovery_pid" 2>/dev/null || true
            wait "$live_recovery_pid" 2>/dev/null || true
            cat /tmp/phmon-live-recovery.log || true
          }
          trap cleanup_live_recovery EXIT
          for _ in $(seq 1 150); do
            [[ -f /tmp/phmon-live-recovery-ready ]] && break
            kill -0 "$live_recovery_pid" 2>/dev/null || {
              cat /tmp/phmon-live-recovery.log
              exit 1
            }
            sleep 0.1
          done
          test -f /tmp/phmon-live-recovery-ready
          python3 scripts/outage_session_smoke.py
          wait "$live_recovery_pid"
          trap - EXIT
          cat /tmp/phmon-live-recovery.log
      - name: Verify database recovery
        id: recovery
        if: always()
        run: |
          docker compose up -d --wait --wait-timeout 120
          python3 scripts/smoke.py
      - name: Require outage and recovery checks to pass
        if: always()
        run: |
          test "${{ steps.outage.outcome }}" = success
          test "${{ steps.recovery.outcome }}" = success
      - name: Verify Nuxt development WebSocket relay
        if: always() && steps.recovery.outcome == 'success' && steps.command_smoke.outcome == 'success'
        shell: bash
        run: |
          set -euo pipefail
          (
            cd web
            NUXT_BACKEND_URL=http://127.0.0.1:8081 \
              npx nuxt dev --host 127.0.0.1 --port 3006 --dotenv ../.env
          ) >/tmp/phmon-nuxt-dev.log 2>&1 &
          dev_pid=$!
          cleanup_dev() {
            kill -TERM "$dev_pid" 2>/dev/null || true
            wait "$dev_pid" 2>/dev/null || true
            cat /tmp/phmon-nuxt-dev.log || true
          }
          trap cleanup_dev EXIT
          for _ in $(seq 1 300); do
            if curl -fsS http://127.0.0.1:3006/api/health >/dev/null 2>&1; then
              break
            fi
            kill -0 "$dev_pid" 2>/dev/null || {
              cat /tmp/phmon-nuxt-dev.log
              exit 1
            }
            sleep 0.1
          done
          curl -fsS http://127.0.0.1:3006/api/health >/dev/null
          SMOKE_WEB_URL=http://127.0.0.1:3006 python3 scripts/live_smoke.py
          SMOKE_WEB_URL=http://127.0.0.1:3006 node scripts/browser_live_audit.mjs
          trap - EXIT
          cleanup_dev
      - if: failure()
        run: docker compose logs --no-color
      - if: always()
        run: docker compose down -v
