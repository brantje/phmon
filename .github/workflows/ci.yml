name: Validation
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18.6-alpine
        env:
          POSTGRES_USER: phmon
          POSTGRES_PASSWORD: ci_only
          POSTGRES_DB: phmon
        ports:
          - 5435:5432
        options: >-
          --health-cmd "pg_isready -U phmon -d phmon"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://phmon:ci_only@127.0.0.1:5435/phmon?sslmode=disable
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.sum
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm --prefix web ci
      - run: bash scripts/check.sh
  stack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: cp .env.example .env
      - run: docker compose up --build -d --wait --wait-timeout 180
      - run: python3 scripts/smoke.py
      - name: Verify authenticated agent connect, reconnect and disconnect
        shell: bash
        run: |
          set -euo pipefail
          agent_json=$(python3 -c 'from urllib.request import Request,urlopen; request=Request("http://127.0.0.1:3005/api/agents/credentials", data=b"{}", headers={"Content-Type":"application/json", "Origin":"http://127.0.0.1:3005", "Sec-Fetch-Site":"same-origin"}, method="POST"); print(urlopen(request, timeout=10).read().decode())')
          export EXPECT_AGENT_ID
          export PHMON_AGENT_ID
          export PHMON_AGENT_TOKEN
          EXPECT_AGENT_ID=$(python3 -c 'import json,sys; print(json.load(sys.stdin)["agent_id"])' <<<"$agent_json")
          PHMON_AGENT_ID="$EXPECT_AGENT_ID"
          PHMON_AGENT_TOKEN=$(python3 -c 'import json,sys; print(json.load(sys.stdin)["agent_token"])' <<<"$agent_json")
          export PHMON_AGENT_URL=ws://127.0.0.1:8081/agent
          export PHMON_SIMULATOR_SCENARIO=character-lifecycle

          python3 scripts/agent_simulator.py >/tmp/phmon-agent.log 2>&1 &
          simulator_pid=$!
          cleanup() {
            if [[ -n "${simulator_pid:-}" ]]; then
              kill -TERM "$simulator_pid" 2>/dev/null || true
              wait "$simulator_pid" 2>/dev/null || true
            fi
            cat /tmp/phmon-agent.log || true
          }
          trap cleanup EXIT

          python3 scripts/agent_smoke.py
          python3 scripts/character_smoke.py
          docker compose stop server
          docker compose up -d --wait --wait-timeout 120 server
          python3 scripts/agent_smoke.py
          python3 scripts/character_smoke.py

          kill -TERM "$simulator_pid"
          wait "$simulator_pid" || true
          simulator_pid=
          EXPECT_AGENT_CONNECTED=0 python3 scripts/agent_smoke.py
          trap - EXIT
          cat /tmp/phmon-agent.log
      - name: Verify database outage
        id: outage
        continue-on-error: true
        run: |
          python3 scripts/outage_session_smoke.py
      - name: Verify database recovery
        id: recovery
        if: always()
        run: |
          docker compose up -d --wait --wait-timeout 120
          python3 scripts/smoke.py
      - name: Require outage and recovery checks to pass
        if: always()
        run: |
          test "${{ steps.outage.outcome }}" = success
          test "${{ steps.recovery.outcome }}" = success
      - if: failure()
        run: docker compose logs --no-color
      - if: always()
        run: docker compose down -v
