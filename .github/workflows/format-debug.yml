name: Temporary Prettier diagnostic
on:
  push:
    branches:
      - feat/90-economy-item-analytics
    paths:
      - .github/workflows/format-debug.yml
permissions:
  contents: read
jobs:
  prettier-diff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm --prefix web ci
      - name: Print formatter changes
        run: |
          cd web
          npx prettier --write app/pages/analytics.vue
          git diff -- app/pages/analytics.vue
