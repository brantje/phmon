name: Format Debug

on:
  push:
    branches:
      - debug/prettier-slice1

permissions:
  contents: read

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm --prefix web ci
      - run: npm --prefix web run format
      - name: Print formatted app
        run: |
          echo '===PHMON_FORMATTED_APP_BEGIN==='
          cat web/app/app.vue
          echo '===PHMON_FORMATTED_APP_END==='
