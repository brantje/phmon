name: Slice 9 format helper

on:
  push:
    branches:
      - codex/slice-9-heatmaps

permissions:
  contents: read

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm --prefix web ci
      - name: Format and emit files
        shell: bash
        run: |
          npm --prefix web exec prettier -- --write             app/pages/map.vue             app/utils/mapHeatmap.ts             shared/types/mapAnalytics.ts             tests/mapHeatmap.test.ts
          for file in             app/pages/map.vue             app/utils/mapHeatmap.ts             shared/types/mapAnalytics.ts             tests/mapHeatmap.test.ts
          do
            echo "PHMON_FORMAT_BEGIN:$file"
            base64 -w0 "web/$file"
            echo
            echo "PHMON_FORMAT_END:$file"
          done
