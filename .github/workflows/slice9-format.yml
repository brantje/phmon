name: Slice 9 format helper

on:
  push:
    branches:
      - codex/slice-9-heatmaps

permissions:
  contents: read

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm --prefix web ci
      - name: Format and emit file
        shell: bash
        run: |
          cd web
          npx prettier --write app/composables/useMapHeatmaps.ts
          echo "PHMON_FORMAT_BEGIN:app/composables/useMapHeatmaps.ts"
          base64 -w0 app/composables/useMapHeatmaps.ts
          echo
          echo "PHMON_FORMAT_END:app/composables/useMapHeatmaps.ts"
